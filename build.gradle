plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
}

base {
    archivesName = mod_id
}

jar {
    manifest {
        attributes('MixinConfigs': 'equipment_complement.mixins.json')
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Required dependencies：VanillaBackport（Spear Core）and Platform library
    // By default, prerequisite JARs are read from `libs/`;
    // you can also specify a different directory using `-Pdependency_dir=<directory>`.
    def dependencyDir = file(providers.gradleProperty('dependency_dir').orElse('libs').get())

    // Select the latest front-end jar in the directory according to the version number in the file name.
    // There is no need to change the build script when upgrading the front-end.
    def latestPrefixed = { String prefix, String label ->
        def candidates = (dependencyDir.listFiles() ?: []).findAll { it.isFile() && it.name.startsWith(prefix) }
        if (candidates.isEmpty()) {
            throw new GradleException(
                    "Missing dependent jar(${label}). Missing required JAR(s) (${label}). Please manually download VanillaBackport (version 1.2 or higher) and Platform (version 1.4 or higher)." +
                    "Place it in libs/，or use -Pdependency_dir=<directory>.")
        }
        // VanillaBackport-neoforge-1.21.1-1.2.2.jar -> "1.2.2"，Compare by numbers segment by segment
        def versionKey = { File f ->
            def matcher = f.name =~ /-1\.21\.1-(\d+(?:\.\d+)*)\.jar$/
            matcher.find() ? matcher.group(1).tokenize('.').collect { it.padLeft(5, '0') }.join('.') : ''
        }
        candidates.sort { a, b -> versionKey(a) <=> versionKey(b) }.last()
    }

    def vbpJar = latestPrefixed('VanillaBackport-neoforge-1.21.1-', 'VanillaBackport')
    def platformJar = latestPrefixed('Platform-neoforge-1.21.1-', 'Platform')
    logger.lifecycle("[equipment-complement] dependencies: ${vbpJar.name} / ${platformJar.name}")

    compileOnly files(vbpJar, platformJar)
    localRuntime files(vbpJar, platformJar)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
